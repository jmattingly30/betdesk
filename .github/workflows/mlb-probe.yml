name: MLB source probe
# One-off check (2026-11-24): can a GitHub runner reach the sources J's MLB app reads? Manual or on push of the probe files.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/mlb/probe_sources.sh', '.github/workflows/mlb-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: bash tools/mlb/probe_sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-probe
          path: probe_out/
          retention-days: 7
