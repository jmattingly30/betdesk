name: CFB v2 weekly refresh
on:
  schedule:
    - cron: "0 15,16 * * 1,4"   # UTC; two hours cover MDT and MST, the first step keeps the one at 09:00 Denver time
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - id: win
        env: { TZ: America/Denver }
        run: |
          d=$(( $(date +%s) - $(date -d "today 09:00" +%s) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || { [ $d -ge 0 ] && [ $d -lt 3300 ]; }; then echo go=1 >> "$GITHUB_OUTPUT"
          else echo "not 09:00 in Denver (this is the other daylight-saving cron); skipping"; fi
      - if: steps.win.outputs.go == '1'
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - if: steps.win.outputs.go == '1'
        uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - if: steps.win.outputs.go == '1'
        run: python3 -m pip install -q -r requirements.txt
      - if: steps.win.outputs.go == '1'
        run: bash tools/cfb_v2.sh
