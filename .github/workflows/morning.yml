name: Bet Desk morning chain
on:
  schedule:
    - cron: "30 12 * * *"   # daylight time (MDT)
    - cron: "30 13 * * *"   # standard time (MST)
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write }
    secrets: inherit
    with: { script: "tools/morning.sh", cron_mdt: "30 12 * * *", cron_mst: "30 13 * * *", timeout: 240, playwright: true }
