name: Bet Desk night pull
# Primary trigger: the Cloudflare Worker cron (worker/schedule.js) sends a Run workflow at the Denver time.
# This GitHub schedule is the backup; run.yml skips it when the Worker already ran it or when GitHub fires it too late.
# Minutes are off :00/:15/:30/:45, where GitHub's scheduler is busiest and most often late or drops runs.
on:
  schedule:
    - cron: "17 4 * * *"   # daylight time (MDT)
    - cron: "17 5 * * *"   # standard time (MST)
  workflow_dispatch: {}
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write, actions: read }
    secrets: inherit
    with: { script: "tools/pull.sh night", cron_mdt: "17 4 * * *", cron_mst: "17 5 * * *", timeout: 200, playwright: true, max_late_h: 4 }
