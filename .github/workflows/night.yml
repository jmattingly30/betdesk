name: Bet Desk night pull
on:
  schedule:
    - cron: "15 4 * * *"   # daylight time (MDT)
    - cron: "15 5 * * *"   # standard time (MST)
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write }
    secrets: inherit
    with: { script: "tools/pull.sh night", cron_mdt: "15 4 * * *", cron_mst: "15 5 * * *", timeout: 200, playwright: true }
