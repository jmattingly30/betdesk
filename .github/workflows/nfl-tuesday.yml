name: Bet Desk NFL Tuesday pull
on:
  schedule:
    - cron: "30 21 * * 2"   # daylight time (MDT)
    - cron: "30 22 * * 2"   # standard time (MST)
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write }
    secrets: inherit
    with: { script: "tools/pull.sh nfl", cron_mdt: "30 21 * * 2", cron_mst: "30 22 * * 2", timeout: 60, playwright: true }
