name: Bet Desk noon pull
on:
  schedule:
    - cron: "0 18 * * *"   # daylight time (MDT)
    - cron: "0 19 * * *"   # standard time (MST)
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write }
    secrets: inherit
    with: { script: "tools/pull.sh noon", cron_mdt: "0 18 * * *", cron_mst: "0 19 * * *", timeout: 90, playwright: true }
