name: Bet Desk NFL Sunday pull
on:
  schedule:
    - cron: "45 2 * * 1"   # daylight time (MDT)
    - cron: "45 3 * * 1"   # standard time (MST)
  workflow_dispatch: {}
concurrency: { group: betdesk-data, cancel-in-progress: false }
jobs:
  run:
    uses: ./.github/workflows/run.yml
    permissions: { contents: write }
    secrets: inherit
    with: { script: "tools/pull.sh nfl", cron_mdt: "45 2 * * 1", cron_mst: "45 3 * * 1", timeout: 60, playwright: true }
