<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bet Desk</title>
<link rel="manifest" href="/guest/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bet Desk">
<meta name="theme-color" content="#0f1115">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Michroma&display=swap">
<style>
:root{--bg:#0f1115;--surface:#161a21;--sunk:#1d222b;--ink:#d9dee7;--muted:#7e8796;--line:#232934;--accent:#3ddc84;--accent-ink:#062b1e;
  --good:#3ddc84;--bad:#ff6b6b;--warn:#ffc94a;--chip:#1f2630;--mb:#7aa7ff;
  --f-display:"Shrikhand",Georgia,serif;--f-body:"Michroma",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.5 var(--f-body);letter-spacing:.01em;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:14px 16px 4px;max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font:400 24px var(--f-display);color:var(--accent);margin:0;white-space:nowrap}
#who{font-size:10px;color:var(--muted);text-align:right}
.note{max-width:640px;margin:8px auto 0;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--surface);font-size:11px;width:calc(100% - 32px)}
main{max-width:640px;margin:0 auto;padding:0 16px}
h2{font:400 21px var(--f-display);margin:18px 0 8px;color:var(--ink)}
h2 .sub{font:600 10px var(--f-body);color:var(--muted);letter-spacing:.06em;margin-left:6px}
h3{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:0 0 auto;min-height:36px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 11px var(--f-body);letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:10px 0}
.panel.ls{border-style:dashed;border-color:var(--warn)}
.panel .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 4px}
.card{padding:10px 0;border-top:1px solid var(--line)}
.panel .card:first-of-type{border-top:0}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pick{font:600 14px var(--f-body);letter-spacing:0;color:var(--ink)}
.edge{font:600 13px var(--f-body);color:var(--good);white-space:nowrap}
.meta{font-size:10px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font:700 9.5px var(--f-body);padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;margin-left:6px;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.tag.b{background:var(--mb);color:#0b1a3a}
.tag.c{background:none;border:1px dashed var(--warn);color:var(--warn)}
.why{margin:6px 0 0;font-size:11px}
ul.r{margin:6px 0 0;padding-left:16px;font-size:10.5px;color:var(--muted)}
ul.r li.p{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px;font-size:10px;color:var(--muted)}
.nums b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
button.b{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:9px 12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.g{background:none;color:var(--ink);border-color:var(--line)}
button.b:disabled{opacity:.5}
button.more{width:100%;margin:2px 0 8px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px;font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
select,textarea,input{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px}
select{font-size:13px;padding:6px}
textarea{width:100%;min-height:80px}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:10.5px}
.empty{color:var(--muted);padding:16px 0;text-align:center;font-size:11px}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rec div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.rec b{display:block;font:400 22px var(--f-display)}
.rec span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.won{color:var(--good)}.lost{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:400 16px var(--f-display);padding:11px 4px;cursor:pointer}
nav button[aria-current=true]{color:var(--accent);border-top-color:var(--accent)}
.lv{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;background:var(--surface);font-size:11px}
.lv b{font:400 15px var(--f-display);margin-right:4px}
.lv input{margin-right:8px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.sprow{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;color:var(--ink);cursor:pointer;font:inherit}
.sprow .spn{font:400 20px var(--f-display)}.sprow .spc{grid-column:1;font-size:10px;color:var(--muted)}.sprow .go{grid-row:1/3;grid-column:2;align-self:center;font:400 24px var(--f-display);color:var(--accent)}
.back{background:none;border:0;color:var(--accent);font:600 11px var(--f-body);letter-spacing:.04em;padding:12px 0 0;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;margin:4px 0 10px}
.seg button{border:0;border-radius:7px;background:none;color:var(--muted);font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;align-items:center}
.gname{font:400 16px var(--f-display);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsc{font:400 19px var(--f-display);color:var(--ink);text-align:right}
.pc{color:var(--accent);font-weight:600}
.gbody{margin-top:6px;padding-left:10px;border-left:2px solid var(--accent)}
.gbody .card{border-top:1px solid var(--line)}
@media (max-width:380px){.pick{font-size:13px}.gname{font-size:15px}}
</style>
</head>
<body>
<header>
  <h1>Bet Desk</h1><span id="who"></span>
</header>
<div id="note" class="note" hidden></div>
<main>
  <section id="v-picks"></section>
  <section id="v-bets" hidden></section>
  <section id="v-me" hidden></section>
</main>
<nav>
  <button type="button" data-v="picks" aria-current="true">Picks</button>
  <button type="button" data-v="bets">My bets</button>
  <button type="button" data-v="me">Me</button>
</nav>
<div id="toast" role="status"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const H = {'content-type':'application/json','x-desk':'1'};
  const api = async (m, p, body) => {
    const r = await fetch('/api/' + p, {method:m, headers:H, credentials:'same-origin', body: body === undefined ? undefined : JSON.stringify(body)});
    if (r.status === 401) { location.reload(); throw new Error('signed out'); }
    if (!r.ok) throw new Error('server ' + r.status);
    return r.json();
  };
  const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); };
  const S = {me:null, picks:[], games:[], bets:[], sport:null, sub:'best', open:null, hidden:new Set(), preview:false};
  try { S.hidden = new Set(JSON.parse(localStorage.getItem('guest.hidden') || '[]')); } catch(e){}
  const price = p => p == null ? '' : (p > 0 ? '+' + p : String(p));
  const won = (u, p) => p > 0 ? u * p / 100 : u * 100 / Math.abs(p || 100);
  const when = p => {
    if (p.kickoff) return new Date(p.kickoff).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'});
    if (p.date) return new Date(p.date + 'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
    return '';
  };
  const level = () => S.me ? S.me.level : 1;
  const SPORT_NAME = {NFL:'NFL', NBA:'NBA', CFB:'College football', CBB:'College basketball', NHL:'NHL', TENNIS:'Tennis'};

  // ---------- picks ----------
  const ctx = p => p.matchup || `${p.away} at ${p.home}`;
  const tagCls = t => t === 'A' ? '' : t === 'B' ? 'b' : 'c';
  function pickCard(p){
    const lv = level(), b = S.bets.find(x => x.pickId === p.id);
    const reasons = lv >= 3 ? p.reasons : p.reasons.filter(r => r.s === '+' || /^Less proven/.test(r.t)).slice(0, 3);
    return `<div class="card" data-id="${esc(p.id)}">
      <div class="row1"><span class="pick">${esc(p.pick)}<span class="tag ${tagCls(p.tier)}">${esc(p.label)}</span></span>${lv >= 3 && p.ev ? `<span class="edge">${p.ev > 0 ? '+' : ''}${p.ev}%</span>` : `<span class="edge">${'★'.repeat(p.stars)}</span>`}</div>
      <div class="meta">${esc(SPORT_NAME[p.sport] || p.sport)} · ${esc(ctx(p))}${p.event ? ' · ' + esc(p.event) : ''} · ${esc(p.book)} ${esc(price(p.price))} · ${esc(when(p))}</div>
      <p class="why">${esc(p.why)}</p>
      ${lv >= 2 && reasons.length ? `<ul class="r">${reasons.map(r => `<li class="${r.s === '+' ? 'p' : ''}">${esc(r.t)}</li>`).join('')}</ul>` : ''}
      ${lv >= 2 ? `<div class="nums">${p.chance != null ? `<span>Our chance it hits: <b>${Math.round(p.chance * 100)}%</b></span>` : ''}${lv >= 3 ? `${p.score != null ? `<span>Unproven score: <b>${p.score}/100</b></span>` : ''}${p.model ? `<span>Our score: <b>${esc(p.away)} ${p.model.away}, ${esc(p.home)} ${p.model.home}</b></span>` : ''}` : ''}</div>` : ''}
      ${S.preview ? '' : `<div class="acts">${b ? `<span class="small"><b>You bet this</b> · ${b.units} unit${b.units == 1 ? '' : 's'}</span>` :
        `<select aria-label="Units" data-u><option value="0.5">½ unit</option><option value="1" selected>1 unit</option><option value="2">2 units</option></select>
         <button class="b" type="button" data-bet>I bet this</button><button class="b g" type="button" data-hide>Not for me</button>`}</div>`}
    </div>`;
  }
  function section(title, sub, list, cls = ''){
    return `<div class="panel ${cls}"><div class="hd"><h3>${title}</h3>${sub ? `<span class="small muted">${sub}</span>` : ''}</div>${list}</div>`;
  }
  const ALL_SP = ['NFL', 'NBA', 'CFB', 'CBB', 'NHL', 'TENNIS'];
  const visible = () => S.picks.filter(p => !S.hidden.has(p.id) && (level() >= 2 || p.tier !== 'C'));
  const spOrder = () => { const order = (S.me && S.me.profile && S.me.profile.sports) || [];
    return s => { const i = order.indexOf(s); return i >= 0 ? i : 10 + ALL_SP.indexOf(s); }; };
  const dayLabel = d => d ? new Date(d + 'T12:00').toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}) : 'Upcoming';
  const tStr = g => g.kickoff ? new Date(g.kickoff).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
  const pct = x => Math.round(x * 100) + '%';
  function gameLine(g){   // our projection in plain words
    if (g.sport === 'TENNIS'){ const p1 = g.p1_win >= 0.5, w = p1 ? g.home : g.away, p = p1 ? g.p1_win : 1 - g.p1_win;
      return `We have ${w} winning ${pct(p)} of the time${g.sets ? `, most often ${g.sets}` : ''}${g.games ? `, about ${Math.round(g.games)} games` : ''}.`; }
    const hw = g.hs >= g.as, w = hw ? g.home : g.away, m = Math.abs(g.hs - g.as);
    return `We have ${w} winning by ${Math.round(m * 10) / 10}${g.p_home != null ? ` (${pct(hw ? g.p_home : 1 - g.p_home)} to win)` : ''}, about ${Math.round(g.hs + g.as)} total points.`;
  }
  function gameRow(g){
    const ps = visible().filter(p => p.game === g.key), open = S.open === g.key, lv = level();
    const score = g.sport === 'TENNIS' ? `${pct(g.p1_win)} – ${pct(1 - g.p1_win)}` : `${Math.round(g.as)}–${Math.round(g.hs)}`;
    const best = ps.length ? Math.max(...ps.map(p => p.stars)) : 0;
    return `<div class="card game${open ? ' open' : ''}">
      <button type="button" class="grow" data-game="${esc(g.key)}">
        <span class="gname">${esc(g.away)} <span class="muted">${g.sport === 'TENNIS' ? 'vs' : 'at'}</span> ${esc(g.home)}</span>
        <span class="gsc">${score}</span>
        <span class="meta" style="grid-column:1/-1">${esc(tStr(g))}${g.event ? ' · ' + esc(g.event) : ''}${ps.length ? ` · <b class="pc">${ps.length} pick${ps.length === 1 ? '' : 's'}${best === 3 ? ' ★' : ''}</b>` : ''}</span>
      </button>
      ${open ? `<div class="gbody"><p class="why">${esc(gameLine(g))}</p>
        ${lv >= 2 && g.spread != null ? `<div class="nums"><span>Books: <b>${esc(g.home)} ${g.spread > 0 ? '−' : '+'}${Math.abs(g.spread)}</b></span>${g.total != null ? `<span>Total <b>${g.total}</b></span>` : ''}</div>` : ''}
        ${ps.length ? ps.map(pickCard).join('') : '<p class="small muted" style="margin:8px 0">No picks in this game. Our number is close to the books’ here.</p>'}</div>` : ''}
    </div>`;
  }
  function renderPicks(){
    const rank = spOrder(), ps = visible();
    const sports = ALL_SP.filter(sp => ps.some(p => p.sport === sp) || S.games.some(g => g.sport === sp)).sort((a, b) => rank(a) - rank(b));
    if (!S.sport || !sports.includes(S.sport)){
      $('#v-picks').innerHTML = `<h2>Sports</h2>${sports.map(sp => { const n = ps.filter(p => p.sport === sp), gs = S.games.filter(g => g.sport === sp), st = n.filter(p => p.tier === 'A').length;
        return `<button type="button" class="sprow" data-sport="${sp}"><span class="spn">${esc(SPORT_NAME[sp] || sp)}</span><span class="spc">${n.length} pick${n.length === 1 ? '' : 's'}${st ? ` · ${st} strong` : ''}${gs.length ? ` · ${gs.length} game${gs.length === 1 ? '' : 's'}` : ''}</span><span class="go">›</span></button>`; }).join('') || '<p class="empty">No games or picks right now. Check back later.</p>'}
        ${level() < 2 && S.picks.some(p => p.tier === 'C') ? `<p class="small muted" style="margin-top:14px">Less proven long shots are hidden. Switch to Guided under Me to see them.</p>` : ''}`;
      return;
    }
    const sp = S.sport, list = ps.filter(p => p.sport === sp), gs = S.games.filter(g => g.sport === sp);
    const sub = S.sub === 'games' ? 'games' : 'best';
    const seg = `<div class="seg"><button type="button" data-sub="best" aria-pressed="${sub === 'best'}">Best bets</button><button type="button" data-sub="games" aria-pressed="${sub === 'games'}">Games</button></div>`;
    let body;
    if (sub === 'best'){
      const games = list.filter(p => p.market !== 'prop'), props = list.filter(p => p.market === 'prop');
      body = (games.length ? section(sp === 'TENNIS' ? 'Matches' : 'Games', '', games.map(pickCard).join('')) : '') +
             (props.length ? section('Player props', '', props.map(pickCard).join('')) : '') ||
             '<p class="empty">No picks right now. New lines come in through the day.</p>';
    } else if (!gs.length){
      body = `<p class="empty">${sp === 'NHL' ? 'We don’t project NHL game scores yet, only player props. See Best bets.' : 'No upcoming games right now.'}</p>`;
    } else {
      const days = [...new Set(gs.map(g => g.date))];
      body = days.map(d => section(esc(dayLabel(d)), `${sp === 'TENNIS' ? 'win chance' : 'our score'}`, gs.filter(g => g.date === d).map(gameRow).join(''))).join('');
    }
    $('#v-picks').innerHTML = `<button type="button" class="back" data-sport="">‹ All sports</button><h2>${esc(SPORT_NAME[sp] || sp)}</h2>${seg}${body}`;
  }

  // ---------- my bets ----------
  function renderBets(){
    const open = S.bets.filter(b => b.status === 'open').sort((a, b) => (a.kickoff || a.date || '').localeCompare(b.kickoff || b.date || ''));
    const done = S.bets.filter(b => b.status !== 'open').sort((a, b) => (b.settled || '').localeCompare(a.settled || ''));
    const w = done.filter(b => b.status === 'won').length, l = done.filter(b => b.status === 'lost').length, pu = done.filter(b => b.status === 'push').length;
    const units = done.reduce((s, b) => s + (b.status === 'won' ? won(b.units, b.price) : b.status === 'lost' ? -b.units : 0), 0);
    const row = b => `<div class="card" data-bid="${esc(b.id)}">
      <div class="row1"><span class="pick">${esc(b.pick)}<span class="tag ${tagCls(b.tier)}">${esc(b.label)}</span></span></div>
      <div class="meta">${esc(SPORT_NAME[b.sport] || b.sport)} · ${esc(b.matchup)} · ${b.units} unit${b.units == 1 ? '' : 's'} at ${esc(b.book)} ${esc(price(b.price))} · ${esc(when(b))}</div>
      <div class="acts">${b.status === 'open' ? `<button class="b" type="button" data-st="won">Won</button><button class="b g" type="button" data-st="lost">Lost</button><button class="b g" type="button" data-st="push">Push</button><button class="b g" type="button" data-del>Remove</button>` :
        `<b class="${b.status}">${b.status === 'won' ? 'Won +' + won(b.units, b.price).toFixed(2) : b.status === 'lost' ? 'Lost −' + b.units : 'Push'}</b><button class="b g" type="button" data-st="open">Undo</button>`}</div></div>`;
    $('#v-bets').innerHTML = `<div class="rec"><div><b>${w}-${l}${pu ? '-' + pu : ''}</b><span>Record</span></div>
      <div><b class="${units >= 0 ? 'won' : 'lost'}">${units >= 0 ? '+' : '−'}${Math.abs(units).toFixed(1)}</b><span>Units</span></div>
      <div><b>${open.length}</b><span>Open</span></div></div>
      <h2>Open</h2>${section('Waiting on results', '', open.map(row).join('') || '<p class="empty">No open bets. Tap “I bet this” on a pick to track it.</p>')}
      ${done.length ? `<h2>Finished</h2>${section('Settled', '', done.slice(0, 50).map(row).join(''))}` : ''}`;
  }

  // ---------- me ----------
  const LEVELS = [[1, 'Simple', 'Just the picks, how confident we are, and one plain reason.'],
                  [2, 'Guided', 'Adds our win chance, a few reasons, and the less proven long shots.'],
                  [3, 'Full', 'Every number: edge, our projected score, and all the pros and cons.']];
  function renderMe(){
    const m = S.me, cur = m.level_auto ? 'auto' : String(m.level);
    $('#v-me').innerHTML = `<h2>How much detail</h2>
      <label class="lv"><input type="radio" name="lv" value="auto" ${cur === 'auto' ? 'checked' : ''}><b>Let the desk decide</b> <span class="small muted">(now ${esc(LEVELS[m.level - 1][1])}) It adds detail as you use it.</span></label>
      ${LEVELS.map(([n, t, d]) => `<label class="lv"><input type="radio" name="lv" value="${n}" ${cur === String(n) ? 'checked' : ''}><b>${t}</b> <span class="small muted">${d}</span></label>`).join('')}
      ${m.honcho ? `<h2>Tell the desk about you</h2><p class="small muted">What sports or bets you like, how much you usually bet, anything you want more or less of. The desk uses this to tailor your picks.</p>
      <p class="small muted">Your bets, passes and notes are shared with Honcho (an outside personalization service) so the desk can learn what you like. Nothing else about you is sent.</p>
      <textarea id="tell" maxlength="600" placeholder="e.g. I mostly watch the NBA and like overs"></textarea>
      <div class="acts"><button class="b" type="button" id="send">Send</button></div>` : ''}
      <h2>How the picks work</h2>
      <p class="small">Our models project the score of every game and compare it with the sportsbooks' lines. <b>Strong picks</b> are the kind of bet that has won most often when we tested it on past games. <b>Leans</b> are good but less sure. <b>Long shots</b> are bets our model likes that haven't been tested as well. No pick is a sure thing, so bet amounts you're fine losing.</p>
      <p class="small muted" style="margin-top:22px"><a href="/logout">Sign out on this device</a></p>`;
  }

  // ---------- actions ----------
  const show = v => { ['picks', 'bets', 'me'].forEach(x => { $('#v-' + x).hidden = x !== v; }); document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v)); scrollTo(0, 0); };
  const renderAll = () => { renderPicks(); renderBets(); if (S.me) renderMe(); };
  document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
  document.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.sport !== undefined) { S.sport = t.dataset.sport || null; S.sub = 'best'; S.open = null; renderPicks(); scrollTo(0, 0); return; }
    if (t.dataset.sub) { S.sub = t.dataset.sub; S.open = null; renderPicks(); return; }
    if (t.dataset.game) { S.open = S.open === t.dataset.game ? null : t.dataset.game; renderPicks(); return; }
    const card = t.closest('.card');
    try {
      if (t.hasAttribute('data-bet')) {
        const p = S.picks.find(x => x.id === card.dataset.id); if (!p) return;
        const units = Number(card.querySelector('[data-u]').value) || 1;
        const b = {id:'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), pickId:p.id, sport:p.sport, market:p.market, pick:p.pick,
          matchup:ctx(p), date:p.date, kickoff:p.kickoff, label:p.label, tier:p.tier, book:p.book, price:p.price, units, status:'open', created:new Date().toISOString()};
        t.disabled = true; await api('PUT', 'db/bets/' + b.id, b); S.bets.push(b); renderAll(); toast('Tracking it in My bets');
      } else if (t.hasAttribute('data-hide')) {
        const p = S.picks.find(x => x.id === card.dataset.id); if (!p) return;
        S.hidden.add(p.id); try { localStorage.setItem('guest.hidden', JSON.stringify([...S.hidden].slice(-300))); } catch(e){}
        renderPicks();
        api('POST', 'note', {text:`I passed on this pick: ${p.pick} (${p.sport} ${p.market}, ${p.label}).`}).catch(() => {});
      } else if (t.dataset.st) {
        const b = S.bets.find(x => x.id === card.dataset.bid); if (!b) return;
        const nb = {...b, status:t.dataset.st, settled:t.dataset.st === 'open' ? null : new Date().toISOString()};
        await api('PUT', 'db/bets/' + b.id, nb); Object.assign(b, nb); renderAll();
      } else if (t.hasAttribute('data-del')) {
        if (!confirm('Remove this bet?')) return;
        await api('DELETE', 'db/bets/' + card.dataset.bid); S.bets = S.bets.filter(x => x.id !== card.dataset.bid); renderAll();
      } else if (t.id === 'send') {
        const v = $('#tell').value.trim(); if (!v) return;
        await api('POST', 'note', {text:v}); $('#tell').value = ''; toast('Thanks, the desk will use that');
      }
    } catch(err){ t.disabled = false; toast('That did not save. Try again.'); }
  });
  document.addEventListener('change', async e => {
    if (e.target.name !== 'lv') return;
    const v = e.target.value;
    if (S.preview) { S.me = {...S.me, level: v === 'auto' ? 1 : Number(v), level_auto: v === 'auto'}; renderAll(); return; }
    try { await api('POST', 'level', {level: v === 'auto' ? null : Number(v)}); S.me = await api('GET', 'me'); renderAll(); toast('Saved'); }
    catch(err){ toast('That did not save. Try again.'); }
  });

  async function boot(){
    try {
      const [me, picks] = await Promise.all([api('GET', 'me'), api('GET', 'picks')]);
      S.me = me; S.picks = picks.picks || []; S.games = picks.games || [];
      S.preview = me.role !== 'guest';   // J looking at the guest view: read only, never touches J's own bets
      if (S.preview) S.me = {...me, level:1, level_auto:true};
      else S.bets = ((await api('GET', 'db/bets')).docs || []).map(d => ({...d.data, id:d.id}));
      $('#who').textContent = S.preview ? 'Guest desk preview' : `Hi ${me.name}`;
      const note = me.profile && me.profile.note;
      if (note) { $('#note').textContent = note; $('#note').hidden = false; }
      renderAll();
    } catch(e){ $('#v-picks').innerHTML = '<p class="empty">Could not load your desk. Pull down to try again.</p>'; }
  }
  boot();
})();
</script>
</body>
</html>
